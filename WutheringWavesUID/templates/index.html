<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>WutheringWavesUID 登录</title>
    <link
      rel="icon"
      href="https://web-static.kurobbs.com/resource/prod/icon.ico"
      type="image/x-icon"
    />
    <script src="https://static.geetest.com/v4/gt4.js"></script>
    <script src="https://apps.bdimg.com/libs/jquery/1.6.4/jquery.min.js"></script>
    <style>
      body,
      html {
        margin: 0;
        padding: 0;
        height: 100%;
        font-family: "Microsoft YaHei", sans-serif;
      }

      body {
        background-image: url("https://prod-alicdn-community.kurobbs.com/forum/465dcb694966492aba4d4982c47f0e8520240914.jpg");
        background-size: cover;
        background-position: center;
        background-repeat: no-repeat;
        display: flex;
        justify-content: center;
        align-items: center;
      }

      body::before {
        content: "";
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background-image: inherit;
        background-size: cover;
        background-position: center;
        background-repeat: no-repeat;
        filter: blur(8px);
        z-index: -1;
      }

      .login-container {
        background-color: rgba(255, 255, 255, 0.2);
        padding: 2rem;
        border-radius: 16px;
        box-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.37);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border: 1px solid rgba(255, 255, 255, 0.18);
        width: 320px;
        transition: all 0.3s ease;
      }

      .login-container:hover {
        transform: translateY(-5px);
        box-shadow: 0 12px 40px 0 rgba(31, 38, 135, 0.45);
      }

      .login-header {
        display: flex;
        align-items: center;
        margin-bottom: 2rem;
        justify-content: space-between;
      }

      .banner {
        width: 80px;
        height: 80px;
        border-radius: 50%;
        overflow: hidden;
        border: 3px solid rgba(255, 255, 255, 0.5);
        box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        margin-right: 0.5rem;
      }

      .banner img {
        width: 100%;
        height: 100%;
        object-fit: cover;
      }

      .banner-text {
        flex: 1;
        padding-right: 1rem;
        margin-left: 0.5rem;
      }

      .welcome-text {
        font-size: 1.5rem;
        font-weight: 700;
        color: #fff;
        margin-bottom: 0.25rem;
        text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.5);
        background: linear-gradient(45deg, #667eea, #764ba2);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
      }

      .logo-text {
        font-size: 0.9rem;
        font-weight: 700;
        color: #fff;
        margin-bottom: 0.25rem;
        text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.5);
      }

      .kurobbs-text {
        font-size: 0.8rem;
        font-weight: 700;
        color: #e6e6e6;
        text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.5);
      }

      .input-group {
        margin-bottom: 1.5rem;
      }

      label {
        display: block;
        margin-bottom: 0.5rem;
        color: #fff;
        font-weight: 500;
      }

      input[type="tel"],
      input[type="text"],
      input[type="email"],
      input[type="password"] {
        width: 100%;
        padding: 0.75rem;
        border: none;
        border-radius: 8px;
        box-sizing: border-box;
        font-size: 16px;
        background-color: rgba(255, 255, 255, 0.9);
        transition: all 0.3s ease;
      }

      input[type="tel"]:focus,
      input[type="text"]:focus,
      input[type="email"]:focus,
      input[type="password"]:focus {
        outline: none;
        box-shadow: 0 0 0 2px rgba(74, 144, 226, 0.6);
      }

      .verification-group {
        display: flex;
        gap: 0.5rem;
      }

      .verification-group input {
        flex-grow: 1;
      }

      button {
        width: 100%;
        padding: 0.75rem;
        background-color: #4a90e2;
        color: white;
        border: none;
        border-radius: 8px;
        cursor: pointer;
        transition: all 0.3s ease;
        font-size: 16px;
        font-weight: 600;
      }

      button:hover {
        background-color: #357abd;
        transform: translateY(-2px);
        box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
      }

      button:disabled {
        background-color: #ccc;
        cursor: not-allowed;
        transform: none;
        box-shadow: none;
      }

      #getCodeBtn {
        width: auto;
        white-space: nowrap;
        padding: 0.75rem 1rem;
        display: inline-block;
      }

      .modal {
        display: none;
        position: fixed;
        z-index: 1000;
        left: 0;
        top: 0;
        width: 100%;
        height: 100%;
        background-color: rgba(0, 0, 0, 0.5);
        opacity: 0;
        transition: opacity 0.3s ease;
      }

      .modal-content {
        background-color: #fefefe;
        margin: 15% auto;
        padding: 20px;
        border: 1px solid #888;
        width: 300px;
        border-radius: 10px;
        text-align: center;
        transform: scale(0.7);
        transition: transform 0.3s ease;
      }

      .modal.show {
        display: block;
        opacity: 1;
      }

      .modal.show .modal-content {
        transform: scale(1);
      }

      .close {
        color: #aaa;
        float: right;
        font-size: 28px;
        font-weight: bold;
        cursor: pointer;
      }

      .close:hover,
      .close:focus {
        color: #000;
        text-decoration: none;
        cursor: pointer;
      }

      .user-id-display {
        text-align: right;
        color: rgba(255, 255, 255, 0.6);
        font-size: 0.8em;
        margin-bottom: 10px;
        transition: opacity 0.3s ease;
      }

      .user-id-display:hover {
        opacity: 1;
      }

      .geetest-container {
        margin: 15px 0;
        padding: 15px;
        background-color: rgba(255, 255, 255, 0.1);
        border-radius: 8px;
        border: 1px solid rgba(255, 255, 255, 0.2);
      }

      .geetest-title {
        color: white;
        font-size: 14px;
        margin-bottom: 10px;
        text-align: center;
      }

      #geetestWidget {
        display: flex;
        justify-content: center;
      }

      .modal-content {
        background-color: #fefefe;
        margin: 15% auto;
        padding: 20px;
        border: 1px solid #888;
        width: 300px;
        border-radius: 10px;
        text-align: center;
        transform: scale(0.7);
        transition:
          transform 0.3s ease,
          opacity 0.3s ease;
      }

      .modal.show .modal-content {
        transform: scale(1);
        opacity: 1;
      }

      .countdown {
        font-size: 0.9em;
        color: #666;
        margin-top: 10px;
      }

      .redirect-button {
        margin-top: 15px;
        padding: 10px 20px;
        background-color: #4a90e2;
        color: white;
        border: none;
        border-radius: 5px;
        cursor: pointer;
        transition: background-color 0.3s ease;
      }

      .redirect-button:hover {
        background-color: #357abd;
      }

      /* 服务器选择器样式 */
      .server-selector {
        margin-bottom: 1.5rem;
      }

      .server-tabs {
        display: flex;
        background: rgba(255, 255, 255, 0.1);
        border-radius: 12px;
        padding: 4px;
        gap: 4px;
      }

      .server-tab {
        flex: 1;
        padding: 12px 16px;
        border: none;
        border-radius: 8px;
        background: transparent;
        color: rgba(255, 255, 255, 0.7);
        font-weight: 600;
        cursor: pointer;
        transition: all 0.3s ease;
        font-size: 14px;
      }

      .server-tab.active {
        background: rgba(255, 255, 255, 0.2);
        color: #fff;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
      }

      .server-tab:hover:not(.active) {
        background: rgba(255, 255, 255, 0.1);
        color: #fff;
      }

      .server-desc {
        display: none;
        margin-top: 12px;
        padding: 10px 12px;
        border-radius: 8px;
        background: rgba(0, 0, 0, 0.15);
        color: rgba(255, 255, 255, 0.85);
        font-size: 12px;
        line-height: 1.55;
        text-align: left;
      }

      .server-desc.active {
        display: block;
      }

      .server-desc-title {
        margin: 0;
        font-weight: 600;
        color: #fff;
      }

      /* 表单样式 */
      .login-form {
        display: none;
      }

      .login-form.active {
        display: block;
      }

      .form-title {
        text-align: center;
        font-size: 1.2rem;
        font-weight: 700;
        color: #fff;
        margin-bottom: 1.5rem;
        text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.5);
      }

      /* 国服登录按钮样式 */
      #cnLoginBtn {
        background: linear-gradient(45deg, #ff6b6b, #ee5a24);
      }

      /* 国际服登录按钮样式 */
      #globalLoginBtn {
        background: linear-gradient(45deg, #667eea, #764ba2);
      }

      #cnLoginBtn:hover {
        box-shadow: 0 8px 20px rgba(255, 107, 107, 0.3);
      }

      #globalLoginBtn:hover {
        box-shadow: 0 8px 20px rgba(102, 126, 234, 0.3);
      }

      /* 响应式设计 */
      @media (max-width: 480px) {
        .server-tab,
        .method-tab {
          font-size: 11px;
          padding: 8px 6px;
        }

        .login-container {
          width: 90%;
          padding: 1.5rem;
        }
      }
    </style>
  </head>

  <body>
    <div class="login-container">
      <div class="login-header">
        <div class="banner-text">
          <div class="welcome-text">欢迎登录</div>
          <div class="logo-text">WutheringWavesUID</div>
          <div class="kurobbs-text">鸣潮UID</div>
        </div>
        <div class="banner">
          <img
            src="https://web-static.kurobbs.com/adminConfig/27/role_icon/1727419309663.png"
            alt="Banner"
          />
        </div>
      </div>

      <!-- 服务器选择 -->
      <div class="server-selector">
        <div class="server-tabs">
          <button class="server-tab" data-server="cn">🇨🇳 国服</button>
          <button class="server-tab active" data-server="global">
            🌍 国际服
          </button>
        </div>
        <div id="cnServerDesc" class="server-desc">
          <p class="server-desc-title">国服（指中国大陆，包含官服和渠道服）</p>
        </div>
        <div id="globalServerDesc" class="server-desc active">
          <p class="server-desc-title">
            国际服（指中国大陆以外的区域，包含美服、欧服、亚服、港澳台服、东南亚服）
          </p>
        </div>
      </div>
      <!-- 国服登录表单 -->
      <form id="cnLoginForm" class="login-form">
        <div class="form-title">国服登录</div>
        <div class="input-group">
          <input
            type="tel"
            id="phone"
            name="phone"
            required
            pattern="[0-9]{11}"
            placeholder="请输入11位手机号"
          />
        </div>
        <div class="input-group">
          <div class="verification-group">
            <input
              type="text"
              id="verificationCode"
              name="verificationCode"
              required
              placeholder="请输入验证码"
            />
            <button type="button" id="getCodeBtn" disabled>获取验证码</button>
          </div>
        </div>
        <div id="userIdDisplay" class="user-id-display">
          当前识别码: {{ userId }}
        </div>
        <button type="submit" id="cnLoginBtn">国服登录</button>
      </form>

      <!-- 国际服登录表单 -->
      <form id="globalLoginForm" class="login-form active">
        <div class="form-title">国际服登录</div>

        <div class="input-group">
          <input
            type="email"
            id="globalEmail"
            name="email"
            required
            placeholder="请输入邮箱地址"
          />
        </div>
        <div class="input-group">
          <input
            type="password"
            id="globalPassword"
            name="password"
            required
            placeholder="请输入密码"
          />
        </div>

        <!-- Geetest 验证区域 -->
        <div
          id="geetestContainer"
          class="geetest-container"
          style="display: none"
        >
          <div class="geetest-title">请完成安全验证</div>
          <div id="geetestWidget"></div>
        </div>

        <div id="userIdDisplay" class="user-id-display">
          当前识别码: {{ userId }}
        </div>
        <button type="submit" id="globalLoginBtn">国际服登录</button>
      </form>
    </div>

    <div id="successModal" class="modal">
      <div class="modal-content">
        <span class="close">&times;</span>
        <h2>🎉 登录成功</h2>
        <p>欢迎回来！请回到 Discord 继续使用机器人。</p>
        <p class="countdown">可以关闭本页面</p>
        <button class="redirect-button">关闭</button>
      </div>
    </div>

    <script>
      // 国服元素
      const phoneInput = document.getElementById("phone");
      const verificationCodeInput = document.getElementById("verificationCode");
      const getCodeBtn = document.getElementById("getCodeBtn");
      const cnLoginBtn = document.getElementById("cnLoginBtn");
      const cnLoginForm = document.getElementById("cnLoginForm");

      // 国际服元素
      const globalLoginForm = document.getElementById("globalLoginForm");
      const globalEmail = document.getElementById("globalEmail");
      const globalPassword = document.getElementById("globalPassword");
      const improvedEmail = document.getElementById("improvedEmail");
      const improvedPassword = document.getElementById("improvedPassword");
      const globalPhone = document.getElementById("globalPhone");
      const globalSmsCode = document.getElementById("globalSmsCode");
      const getGlobalSmsBtn = document.getElementById("getGlobalSmsBtn");

      // 通用元素
      const modal = document.getElementById("successModal");
      const closeBtn = modal.querySelector(".close");

      // 当前选中的服务器
      let currentServer = "global";

      // 重试计数器
      let retryCount = 0;
      const maxRetries = 2;

      const globalServerDesc = document.getElementById("globalServerDesc");
      const cnServerDesc = document.getElementById("cnServerDesc");

      // 服务器切换功能
      document.querySelectorAll(".server-tab").forEach((tab) => {
        tab.addEventListener("click", function () {
          // 移除所有活动状态
          document
            .querySelectorAll(".server-tab")
            .forEach((t) => t.classList.remove("active"));
          document
            .querySelectorAll(".login-form")
            .forEach((f) => f.classList.remove("active"));
          document
            .querySelectorAll(".server-desc")
            .forEach((d) => d.classList.remove("active"));

          // 添加活动状态
          this.classList.add("active");
          currentServer = this.dataset.server;

          if (currentServer === "cn") {
            cnLoginForm.classList.add("active");
            cnServerDesc.classList.add("active");
          } else {
            globalLoginForm.classList.add("active");
            globalServerDesc.classList.add("active");
          }
        });
      });

      // 国际服输入验证
      globalEmail.addEventListener("input", function () {
        globalLoginBtn.disabled =
          this.value === "" || globalPassword.value === "";
      });

      globalPassword.addEventListener("input", function () {
        globalLoginBtn.disabled = this.value === "" || globalEmail.value === "";
      });

      // 国服输入验证
      phoneInput.addEventListener("input", function () {
        getCodeBtn.disabled = this.value.length !== 11;
        cnLoginBtn.disabled =
          this.value.length !== 11 || verificationCodeInput.value === "";
      });

      verificationCodeInput.addEventListener("input", function () {
        cnLoginBtn.disabled =
          this.value === "" || phoneInput.value.length !== 11;
      });

      const headers = {
        devcode: generateRandomString(),
        source: "h5",
      };

      const captchaId = "ec4aa4174277d822d73f2442a165a2cd";
      const product = "bind";

      initGeetest4(
        {
          captchaId: captchaId,
          product: product,
        },
        function (captcha) {
          captcha
            .onReady(function () {})
            .onSuccess(function () {
              var result = captcha.getValidate();
              if (!result) {
                return alert("请完成验证");
              }
              result.captcha_id = captchaId;
              $.ajax({
                url: "https://api.kurobbs.com/user/getSmsCodeForH5",
                type: "POST", // 通常发送数据使用 POST
                data: {
                  mobile: phoneInput.value,
                  geeTestData: JSON.stringify(result),
                },
                headers: headers,
                success: (res) =>
                  alert(
                    res.success
                      ? "验证码已发送"
                      : "验证码发送失败 : " + res.msg,
                  ),
                error: () => alert("请求出错，请检查网络连接"),
              });
            })
            .onError(function () {
              alert("请求出错，请检查网络连接");
            });

          getCodeBtn.onclick = function () {
            this.disabled = true;
            let countdown = 60;
            const originalText = this.textContent;

            captcha.showBox();

            const timer = setInterval(() => {
              this.textContent = `${countdown}秒后重试`;
              countdown--;
              if (countdown < 0) {
                clearInterval(timer);
                this.textContent = originalText;
                this.disabled = false;
                captcha.hideBox();
              }
            }, 1000);
          };
        },
      );

      // 国服登录
      cnLoginForm.addEventListener("submit", function (e) {
        const data = {
          mobile: phoneInput.value,
          code: verificationCodeInput.value,
          auth: "{{ auth }}",
        };
        e.preventDefault();
        $.ajax({
          url: "{{ server_url }}/waves/login",
          type: "POST",
          data: JSON.stringify(data),
          contentType: "application/json",
          success: (res) =>
            res.success
              ? showSuccessModal()
              : alert("登录失败" + (res.msg ? res.msg : "，请重试")),
          error: () => alert("登录失败，请重试"),
        });
      });

      // 国际服登录
      globalLoginForm.addEventListener("submit", function (e) {
        e.preventDefault();

        const email = globalEmail.value;
        const password = globalPassword.value;

        if (!email || !password) {
          alert("请填写邮箱和密码");
          return;
        }

        // 检查是否已经有 Geetest 验证数据
        const geetestData = window.geetestResult;

        // 调用国际服登录 API
        const requestData = {
          email: email,
          password: password,
          auth: "{{ auth }}",
          geetest_data: geetestData,
        };

        console.log("发送登录请求:", requestData);
        console.log("Geetest 数据:", geetestData);
        console.log("服务器 URL:", "{{ server_url }}");

        fetch("{{ server_url }}/waves/international/login", {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
          },
          body: JSON.stringify(requestData),
        })
          .then((response) => {
            console.log("响应状态:", response.status);
            return response.json();
          })
          .then((data) => {
            console.log("响应数据:", data);
            // 保存响应数据供模态框使用
            window.lastResponse = data;

            if (data.success) {
              retryCount = 0; // 重置重试计数器
              showSuccessModal();
            } else if (data.need_verification) {
              // 需要 Geetest 验证
              console.log("需要进行 Geetest 验证");
              if (retryCount < maxRetries) {
                retryCount++;
                console.log(`第 ${retryCount} 次重试`);
                showGeetestVerification();
              } else {
                console.error("重试次数已达上限");
                alert("验证失败次数过多，请重新加载页面后再试");
                retryCount = 0; // 重置计数器
              }
            } else {
              console.error("登录失败:", data.msg);
              // 检查是否为 Geetest 验证失败
              if (
                data.msg &&
                (data.msg.includes("Geetest") ||
                  data.msg.includes("验证") ||
                  data.msg.includes("校验码"))
              ) {
                console.log("检测到 Geetest 验证失败，尝试重新验证");
                if (retryCount < maxRetries) {
                  retryCount++;
                  console.log(`第 ${retryCount} 次重试（Geetest 验证失败）`);
                  showGeetestVerification();
                } else {
                  console.error("重试次数已达上限");
                  alert("验证失败次数过多，请重新加载页面后再试");
                  retryCount = 0; // 重置计数器
                }
              } else {
                alert("登录失败: " + (data.msg || "请重试"));
                retryCount = 0; // 重置计数器
              }
            }
          })
          .catch((error) => {
            console.error("Error:", error);
            alert("登录失败，请重试");
          });
      });

      // 显示 Geetest 验证
      function showGeetestVerification() {
        const geetestContainer = document.getElementById("geetestContainer");
        geetestContainer.style.display = "block";

        // 清除之前的验证結果
        window.geetestResult = null;

        // 初始化 Geetest
        // 使用游戏登录的 CaptchaId，而不是网站登录的
        initGeetest4(
          {
            captchaId: "1f4565ff7acc97b1a2fc97b921743aa4", // CaptchaId.GAME
            product: "bind",
            language: "zh-Hans",
          },
          function (captcha) {
            captcha.onReady(function () {
              captcha.showCaptcha();
            });

            captcha.onSuccess(function () {
              // 保存验证結果
              const validateData = captcha.getValidate();
              console.log("Geetest 原始数据:", validateData);

              // 检查原始数据的字段
              console.log("lot_number:", validateData.lot_number);
              console.log("pass_token:", validateData.pass_token);
              console.log("gen_time:", validateData.gen_time);
              console.log("captcha_output:", validateData.captcha_output);

              // 验证必要字段
              if (
                !validateData.lot_number ||
                !validateData.pass_token ||
                !validateData.gen_time
              ) {
                console.error("Geetest 数据不完整:", validateData);
                alert("验证数据不完整，请重新验证");
                captcha.reset(); // 重置验证
                return;
              }

              // 检查时间戳是否合理
              let genTime = validateData.gen_time || "";
              const currentTime = Math.floor(Date.now() / 1000);

              if (genTime) {
                try {
                  const genTimeInt = parseInt(genTime);
                  if (genTimeInt > currentTime + 300) {
                    // 如果时间戳超过当前时间5分钟
                    console.warn(
                      `Geetest 时间戳异常: ${genTime}, 当前时间: ${currentTime}`,
                    );
                    genTime = currentTime.toString();
                    console.info(`已修正时间戳为: ${genTime}`);
                  }
                } catch (e) {
                  console.warn("Geetest 时间戳格式错误，使用当前时间");
                  genTime = currentTime.toString();
                }
              } else {
                genTime = currentTime.toString();
              }

              // 转换为 MMTResult 格式（匹配 kuro.py 的最新要求）
              // 使用游戏登录的 CaptchaId，而不是网站登录的
              const mmtResult = {
                captcha_id: "1f4565ff7acc97b1a2fc97b921743aa4", // CaptchaId.GAME
                lot_number: validateData.lot_number || "",
                pass_token: validateData.pass_token || "",
                gen_time: genTime,
                captcha_output: validateData.captcha_output || "",
              };

              // 添加调试信息
              console.log("Geetest 验证数据检查:");
              console.log(
                "- lot_number:",
                mmtResult.lot_number ? "存在" : "缺失",
              );
              console.log(
                "- pass_token:",
                mmtResult.pass_token ? "存在" : "缺失",
              );
              console.log("- gen_time:", mmtResult.gen_time);
              console.log(
                "- captcha_output:",
                mmtResult.captcha_output ? "存在" : "缺失",
              );
              console.log(
                "- 时间戳差异:",
                Math.floor(Date.now() / 1000) - parseInt(genTime),
                "秒",
              );

              window.geetestResult = JSON.stringify(mmtResult);
              console.log("Geetest 转换后数据:", window.geetestResult);

              // 隐藏验证界面
              geetestContainer.style.display = "none";

              // 自动重新提交登录
              globalLoginForm.dispatchEvent(new Event("submit"));
            });

            captcha.onError(function () {
              console.error("Geetest 验证失败");
              alert("验证失败，请重试");
            });

            captcha.onClose(function () {
              console.log("Geetest 验证被关闭");
              // 可以选择是否隐藏验证界面
            });
          },
        );
      }

      function showSuccessModal() {
        const modal = document.getElementById("successModal");
        const redirectButton = modal.querySelector(".redirect-button");

        modal.classList.add("show");
        setTimeout(() => {
          modal.querySelector(".modal-content").style.transform = "scale(1)";
          modal.querySelector(".modal-content").style.opacity = "1";
        }, 10);

        const dismiss = () => {
          modal.querySelector(".modal-content").style.transform = "scale(0.7)";
          modal.querySelector(".modal-content").style.opacity = "0";
          setTimeout(() => modal.classList.remove("show"), 300);
        };

        redirectButton.addEventListener("click", dismiss);
        modal.querySelector(".close").addEventListener("click", dismiss);
      }

      closeBtn.addEventListener("click", closeModal);

      function closeModal() {
        modal.querySelector(".modal-content").style.transform = "scale(0.7)";
        setTimeout(() => {
          modal.classList.remove("show");
        }, 300);
      }

      window.addEventListener("click", function (event) {
        if (event.target === modal) {
          closeModal();
        }
      });

      function loadBackgroundImage() {
        const img = new Image();
        img.onload = function () {
          document.body.style.backgroundImage = `url(${img.src})`;
          document.body.classList.add("bg-loaded");
        };
        img.src =
          "https://prod-alicdn-community.kurobbs.com/forum/465dcb694966492aba4d4982c47f0e8520240914.jpg";
      }

      window.addEventListener("load", loadBackgroundImage);

      function generateRandomString() {
        const chars =
          "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789";
        return Array(32)
          .fill(0)
          .map(() => chars.charAt(Math.floor(Math.random() * chars.length)))
          .join("");
      }
    </script>
  </body>
